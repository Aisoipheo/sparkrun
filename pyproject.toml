[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkrun"
version = "0.3.10"
description = "Launch and manage Docker-based inference workloads on NVIDIA DGX Spark systems"
readme = "README.md"
# Distribution metadata covers host and plugin; their individual terms remain
# in the retained license files, including the sparkrun combination permission.
license = "Apache-2.0 AND AGPL-3.0-only"
license-files = ["LICENSE", "src/sparkrun/plugins/sparkroute/LICENSE", "src/sparkrun/plugins/sparkroute/LICENSE_EXCEPTION"]
requires-python = ">=3.12"
authors = [
    { name = "scitrera.ai", email = "open-source-team@scitrera.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Clustering",
]
dependencies = [
    "scitrera-app-framework==0.0.69",
    "vpd==0.9.13",
    "six==1.17.0", # transitive dependency of vpd but we pin the version for security reasons
    "idna==3.15", # transitive (requests/huggingface-hub) pinned to the CVE-2026-45409 fix
    "pygments==2.20.0", # transitive (rich/textual) pinned to the CVE-2026-4539 fix
    "click==8.3.3",
    "pyyaml==6.0.3",
    "huggingface-hub==1.8.0",
    "textual==8.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
]

[project.scripts]
sparkrun = "sparkrun.cli:main"

[project.entry-points."sparkrun.runtimes"]
vllm-distributed = "sparkrun.runtimes.vllm_distributed:VllmDistributedRuntime"
vllm-ray = "sparkrun.runtimes.vllm_ray:VllmRayRuntime"
sglang = "sparkrun.runtimes.sglang:SglangRuntime"
eugr-vllm = "sparkrun.runtimes.eugr_vllm_ray:EugrVllmRayRuntime"
llama-cpp = "sparkrun.runtimes.llama_cpp:LlamaCppRuntime"
trtllm = "sparkrun.runtimes.trtllm:TrtllmRuntime"
atlas = "sparkrun.runtimes.atlas:AtlasRuntime"
tokenary = "sparkrun.runtimes.tokenary:TokenaryRuntime"
modular-max = "sparkrun.runtimes.modular_max:ModularMaxRuntime"

[project.entry-points."sparkrun.benchmarking"]
llama-benchy = "sparkrun.benchmarking.llama_benchy:LlamaBenchyFramework"
tool-eval-bench = "sparkrun.benchmarking.tool_eval_bench:ToolEvalBenchFramework"

[project.entry-points."sparkrun.builders"]
docker-pull = "sparkrun.builders.docker_pull:DockerPullBuilder"
eugr = "sparkrun.builders.eugr:EugrBuilder"

[project.entry-points."sparkrun.executors"]
docker = "sparkrun.orchestration.executors.docker:DockerExecutor"
local = "sparkrun.orchestration.executors.local:LocalExecutor"
k8s = "sparkrun.orchestration.executors.k8s:K8sExecutor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sparkrun.scripts" = ["*.sh"]
"sparkrun.plugins.sparkroute" = ["LICENSE", "LICENSE_EXCEPTION", "README.md", "VENDORED.toml"]
"sparkrun.bin" = ["nv-monitor-*", "prom2json-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Wall-clock cap per test (pytest-timeout). The point is hang detection —
# an SSH probe into a black hole, a readiness watcher that never returns —
# not pacing slow tests, so it is set far above the slowest legitimate test
# (the full-range port scan) with head room for slower CI runners. Signals
# on POSIX, threads on Windows (the plugin's platform default).
timeout = 120
# Dump tracebacks of anything still running at 60s before the cap kills it,
# so a timeout in CI ships with the stack that caused it.
faulthandler_timeout = 60

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# ruff's default set (E4/E7/E9/F) plus flake8-bugbear.  B is enforced rather
# than merely available because its three recurring findings here are each a
# silent failure: an unchained `raise` inside `except` loses the traceback that
# names the real cause, and a `zip()` without `strict=` truncates to the shorter
# input rather than reporting the skew.  Keeping it green means every new
# `zip()` states which it wants.
select = ["E4", "E7", "E9", "F", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4",
    "ruff>=0.15.9",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
